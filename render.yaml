databases:
  - name: asra-db
    plan: free

services:
  - type: web
    name: asra
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: asra-db
          property: connectionString
      - key: VISION_ENABLED
        value: "false"
      - key: USE_WEATHER_API
        value: "true"
